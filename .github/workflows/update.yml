name: Check for Updates

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to update to (without rust-v prefix)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: codex-update
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Check for new version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          CURRENT_VERSION=$(grep 'version = "' package.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Current version: $CURRENT_VERSION"

          if [ -n "$INPUT_VERSION" ]; then
            REQUESTED_VERSION="${INPUT_VERSION#rust-v}"
            RELEASE_JSON=$(gh release view "rust-v${REQUESTED_VERSION}" --repo openai/codex --json tagName,assets)
          else
            RELEASE_JSON=$(gh release view --repo openai/codex --json tagName,assets)
          fi

          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tagName')
          if ! [[ "$TAG_NAME" =~ ^rust-v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Unexpected Codex release tag: $TAG_NAME" >&2
            exit 1
          fi

          NEW_VERSION="${TAG_NAME#rust-v}"
          echo "Target version: $NEW_VERSION"

          EXPECTED_ASSETS=(
            "codex-x86_64-unknown-linux-musl.tar.gz"
            "codex-aarch64-unknown-linux-musl.tar.gz"
            "codex-x86_64-apple-darwin.tar.gz"
            "codex-aarch64-apple-darwin.tar.gz"
          )

          ASSETS=$(echo "$RELEASE_JSON" | jq -r '.assets[].name')
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if ! grep -Fxq "$asset" <<< "$ASSETS"; then
              echo "Release $TAG_NAME is missing expected asset: $asset" >&2
              exit 1
            fi
          done

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update version and hashes
        if: steps.check.outputs.update_needed == 'true'
        run: bash ./scripts/update.sh "${{ steps.check.outputs.new_version }}"

      - name: Verify build
        if: steps.check.outputs.update_needed == 'true'
        run: |
          nix build .#codex --print-build-logs
          ./result/bin/codex --version

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "update codex to ${{ steps.check.outputs.new_version }}"
          title: "update codex to ${{ steps.check.outputs.new_version }}"
          body: |
            Updates codex from `${{ steps.check.outputs.current_version }}` to `${{ steps.check.outputs.new_version }}`.

            **Release:** https://github.com/openai/codex/releases/tag/rust-v${{ steps.check.outputs.new_version }}

            **Validation:** `nix build .#codex --print-build-logs` and `./result/bin/codex --version`

            ---
            *Auto-generated by the update workflow.*
          branch: update/codex-${{ steps.check.outputs.new_version }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable auto-merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        id: auto_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch; then
            echo "auto_merge_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto_merge_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not enable auto-merge. The PR was left open for manual merge."
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Update Check" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.update_needed }}" == "true" ]; then
            echo "- **Current:** ${{ steps.check.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **New:** ${{ steps.check.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **PR:** #${{ steps.create-pr.outputs.pull-request-number }}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.auto_merge.outputs.auto_merge_enabled }}" == "true" ]; then
              echo "- Auto-merge enabled" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Auto-merge was not enabled; merge the PR manually after CI passes" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "Already up to date." >> $GITHUB_STEP_SUMMARY
          fi
