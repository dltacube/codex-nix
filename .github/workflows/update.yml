name: Check for Updates

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to update to (without rust-v prefix)"
        required: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: codex-update
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Check for new version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          CURRENT_VERSION=$(grep 'version = "' package.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Current version: $CURRENT_VERSION"

          if [ -n "$INPUT_VERSION" ]; then
            REQUESTED_VERSION="${INPUT_VERSION#rust-v}"
            RELEASE_JSON=$(gh release view "rust-v${REQUESTED_VERSION}" --repo openai/codex --json tagName,assets)
          else
            RELEASE_JSON=$(gh release view --repo openai/codex --json tagName,assets)
          fi

          TAG_NAME=$(jq -r '.tagName' <<<"$RELEASE_JSON")
          if ! [[ "$TAG_NAME" =~ ^rust-v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Unexpected Codex release tag: $TAG_NAME" >&2
            exit 1
          fi

          NEW_VERSION="${TAG_NAME#rust-v}"
          echo "Target version: $NEW_VERSION"

          EXPECTED_ASSETS=(
            "codex-package-x86_64-unknown-linux-musl.tar.gz"
            "codex-package-aarch64-unknown-linux-musl.tar.gz"
            "codex-package-x86_64-apple-darwin.tar.gz"
            "codex-package-aarch64-apple-darwin.tar.gz"
          )

          ASSETS=$(jq -r '.assets[].name' <<<"$RELEASE_JSON")
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if ! grep -Fxq "$asset" <<< "$ASSETS"; then
              echo "Release $TAG_NAME is missing expected asset: $asset" >&2
              exit 1
            fi
          done

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            {
              printf 'new_version=%s\n' "$NEW_VERSION"
              printf 'current_version=%s\n' "$CURRENT_VERSION"
              echo "update_needed=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version and hashes
        if: steps.check.outputs.update_needed == 'true'
        run: bash ./scripts/update.sh "${{ steps.check.outputs.new_version }}"

      - name: Verify build
        if: steps.check.outputs.update_needed == 'true'
        run: |
          nix build .#codex --print-build-logs
          bash tests/release-smoke.sh ./result x86_64-unknown-linux-musl

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "update codex to ${{ steps.check.outputs.new_version }}"
          title: "update codex to ${{ steps.check.outputs.new_version }}"
          body: |
            Updates codex from `${{ steps.check.outputs.current_version }}` to `${{ steps.check.outputs.new_version }}`.

            **Release:** https://github.com/openai/codex/releases/tag/rust-v${{ steps.check.outputs.new_version }}

            **Validation:** Linux smoke testing runs before this PR is created. The full native four-platform `Release Gate` is dispatched for this branch and is required before merge.

            ---
            *Auto-generated by the update workflow.*
          branch: update/codex-${{ steps.check.outputs.new_version }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Request reviews
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr edit "$PR_NUMBER" --add-reviewer nimkar-progyny || \
            echo "::warning::nimkar-progyny is unavailable as a reviewer"
          gh pr edit "$PR_NUMBER" --add-reviewer @copilot || \
            echo "::warning::Copilot code review is unavailable"

      - name: Dispatch release gate
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ steps.create-pr.outputs.pull-request-branch }}
        run: gh workflow run build.yml --ref "$PR_BRANCH"

      - name: Enable auto-merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        id: auto_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          if gh pr merge "$PR_NUMBER" --auto --squash --delete-branch; then
            echo "auto_merge_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto_merge_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not enable auto-merge. The PR was left open for manual merge."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Update Check"
            if [ "${{ steps.check.outputs.update_needed }}" == "true" ]; then
              echo "- **Current:** ${{ steps.check.outputs.current_version }}"
              echo "- **New:** ${{ steps.check.outputs.new_version }}"
              echo "- **PR:** #${{ steps.create-pr.outputs.pull-request-number }}"
              if [ "${{ steps.auto_merge.outputs.auto_merge_enabled }}" == "true" ]; then
                echo "- Auto-merge enabled"
              else
                echo "- Auto-merge was not enabled; merge the PR manually after CI passes"
              fi
            else
              echo "Already up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
