name: Create Version Tag

on:
  workflow_run:
    workflows: ["Release Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version = "' package.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version tag
        id: version-tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "v${{ steps.version.outputs.version }}")
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "v${{ steps.version.outputs.version }} already points to $TAG_SHA, not $HEAD_SHA" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create version tag
        if: steps.version-tag.outputs.exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "codex v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Update latest tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$MAIN_SHA" != "$HEAD_SHA" ]; then
            echo "Skipping latest: tested commit $HEAD_SHA is no longer main ($MAIN_SHA)."
            exit 0
          fi
          git push origin :refs/tags/latest 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git tag -a "latest" -m "Latest: v${{ steps.version.outputs.version }}"
          git push origin latest
